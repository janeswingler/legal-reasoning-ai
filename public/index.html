<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Legal Reasoning AI — Access</title>
        <link rel="stylesheet" href="./css/variables.css?v=20260725a" />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/enter.css?v=20260725a" />
    </head>
    <body class="enter-page">
        <main class="enter-card" aria-labelledby="enterTitle">
            <header class="enter-card__header">
                <h1 id="enterTitle" class="enter-card__title">Legal Reasoning AI</h1>
                <p class="enter-card__subtitle">Research prototype — authorized access only</p>
            </header>

            <form id="enterForm" class="enter-form" novalidate>
                <div class="enter-field">
                    <label class="enter-label" for="accessPassword">Access password</label>
                    <input
                        id="accessPassword"
                        name="password"
                        type="password"
                        class="enter-input"
                        autocomplete="current-password"
                        required
                    />
                </div>

                <div class="enter-field">
                    <label class="enter-label" for="participantID">Participant ID</label>
                    <input
                        id="participantID"
                        name="participantID"
                        type="text"
                        class="enter-input"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                </div>

                <div class="enter-field">
                    <label class="enter-label" for="assignmentId">Week</label>
                    <input
                        id="assignmentId"
                        name="assignmentId"
                        type="text"
                        class="enter-input"
                        placeholder="week-01"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                </div>

                <div class="enter-field">
                    <label class="enter-label" for="systemID">Study mode</label>
                    <select id="systemID" name="systemID" class="enter-input enter-select">
                        <option value="2" selected>AI chat + assignment editor</option>
                        <option value="1">Assignment editor only (no AI)</option>
                    </select>
                </div>

                <p id="enterError" class="enter-error" hidden role="alert"></p>

                <button type="submit" class="enter-submit" id="enterSubmitBtn">
                    Continue to app
                </button>
            </form>
        </main>
        <script src="./js/enter.js?v=20260725a"></script>
    </body>
</html>
