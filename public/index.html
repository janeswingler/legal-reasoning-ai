<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Legal Reasoning AI</title>

        <link rel="stylesheet" href="./css/variables.css" />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/layout.css" />
        <link rel="stylesheet" href="./css/chat.css" />
        <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
        <link rel="stylesheet" href="./css/notes.css" />

    </head>
    <body>
        <header class="app-header">
            <h1>Legal Reasoning AI</h1>
        </header>

        <main class="app-main">
            <section class="panel panel-chat" aria-label="Chat panel">
                <h2 class="panel-chat__label">Chat</h2>
                <div class="chat-layout">
                    <aside class="chat-sidebar" aria-label="Chat sessions">
                        <button type="button" class="chat-sidebar__new" id="newChatBtn">
                            <span class="chat-sidebar__new-icon" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path
                                        d="M8 3.5v9M3.5 8h9"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                        stroke-linecap="round"
                                    />
                                </svg>
                            </span>
                            New chat
                        </button>
                        <ul class="chat-sidebar__list" id="chatSessionList"></ul>
                    </aside>
                    <div class="chat-main">
                        <div class="chat-log" id="chatLog"></div>
                        <div class="chat-attachments" id="chatAttachments" hidden>
                            <span class="chat-attachments__label">Attached PDFs</span>
                            <ul class="chat-attachments__list" id="chatAttachmentList"></ul>
                        </div>
                        <form class="chat-composer" id="chatForm">
                            <input
                                type="file"
                                id="chatFileInput"
                                accept="application/pdf,.pdf"
                                hidden
                            />
                            <button
                                type="button"
                                class="chat-composer__attach"
                                id="attachFileBtn"
                                aria-label="Attach PDF"
                            >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                                        stroke="currentColor"
                                        stroke-width="1.75"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </button>
                            <label class="sr-only" for="chatInput">Message</label>
                            <input
                                id="chatInput"
                                name="message"
                                type="text"
                                autocomplete="off"
                                placeholder="Type your message…"
                            />
                            <button type="submit">Send</button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="panel panel-notes" aria-label="Notes panel">
                <h2 class="panel-notes__label">Assignment Notes</h2>
                <div class="notes-toolbar">
                    <div class="notes-toolbar__meta">
                        <span class="notes-toolbar__assignment" id="assignmentLabel"></span>
                        <span class="save-status" id="saveStatus">Loading…</span>
                        <div class="export-menu" id="exportMenu">
                            <button
                                type="button"
                                id="exportMenuBtn"
                                class="export-menu__trigger"
                                aria-haspopup="menu"
                                aria-expanded="false"
                                aria-controls="exportMenuList"
                            >
                                Export
                            </button>
                            <ul class="export-menu__list" id="exportMenuList" role="menu" hidden>
                                <li role="none">
                                    <button type="button" role="menuitem" data-export="html">HTML</button>
                                </li>
                                <li role="none">
                                    <button type="button" role="menuitem" data-export="pdf">
                                        PDF (.pdf)
                                    </button>
                                </li>
                                <li role="none">
                                    <button type="button" role="menuitem" data-export="docx">Word (.docx)</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div
                        id="noteToolbar"
                        class="note-format-toolbar ql-toolbar ql-snow"
                        aria-label="Text formatting"
                    >
                        <span class="ql-formats">
                            <button type="button" class="ql-bold" aria-label="Bold"></button>
                            <button type="button" class="ql-italic" aria-label="Italic"></button>
                            <button type="button" class="ql-underline" aria-label="Underline"></button>
                        </span>
                        <span class="ql-formats">
                            <button type="button" class="ql-list" value="ordered" aria-label="Numbered list"></button>
                            <button type="button" class="ql-list" value="bullet" aria-label="Bullet list"></button>
                        </span>
                        <span class="ql-formats">
                            <button type="button" class="ql-clean" aria-label="Clear formatting"></button>
                        </span>
                    </div>
                </div>

                <div class="pleading-paper" id="pleadingPaper">
                    <div class="pleading-scroll-surface" id="pleadingScrollSurface">
                        <div class="pleading-backdrop" id="pleadingBackdrop" aria-hidden="true"></div>
                        <div class="pleading-editor-layer">
                            <div class="notes-editor-wrap">
                                <div id="noteEditor" aria-label="Assignment notes"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
        <script src="./vendor/html2canvas.min.js"></script>
        <script src="./vendor/jspdf.umd.min.js"></script>
        <script src="./js/config.js"></script>
        <script src="./js/logging.js"></script>
        <script src="./js/pleading/layout-spec.js"></script>
        <script src="./js/pleading/stylesheet.js"></script>
        <script src="./js/pleading/page-view.js"></script>
        <script src="./js/pleading/paginator.js"></script>
        <script src="./js/pleading/document.js"></script>
        <script src="./js/chat.js"></script>
        <script src="./js/notes.js"></script>
    </body>
</html>
