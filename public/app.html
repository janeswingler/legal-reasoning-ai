<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Legal Reasoning AI</title>

        <link rel="stylesheet" href="./css/variables.css?v=20260711v" />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/layout.css?v=20260711am" />
        <link rel="stylesheet" href="./css/chat.css?v=20260712c" />
        <link rel="stylesheet" href="./css/notes.css?v=20260711ak" />

    </head>
    <body>
        <script>
            (function () {
                var raw = new URLSearchParams(location.search).get("systemID");
                var id = raw && String(raw).trim() === "1" ? "1" : "2";
                document.body.classList.add(id === "1" ? "system-1" : "system-2");
            })();
        </script>
        <main class="app-main">
            <section class="panel panel-chat" aria-label="Chat panel">
                <div class="chat-layout" id="chatLayout">
                    <aside class="chat-sidebar" id="chatSidebar" aria-label="Chat sessions">
                        <div class="chat-sidebar__header">
                            <h1 class="chat-sidebar__title" id="assignmentTitle"></h1>
                            <button
                                type="button"
                                class="chat-sidebar-toggle"
                                id="chatSidebarToggle"
                                aria-controls="chatSidebar"
                                aria-expanded="true"
                                aria-label="Close sidebar"
                                data-tooltip="Close sidebar"
                            >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <rect
                                        x="3.75"
                                        y="4.75"
                                        width="16.5"
                                        height="14.5"
                                        rx="2.25"
                                        stroke="currentColor"
                                        stroke-width="1.75"
                                    />
                                    <path
                                        d="M9.25 5v14"
                                        stroke="currentColor"
                                        stroke-width="1.75"
                                        stroke-linecap="round"
                                    />
                                </svg>
                            </button>
                        </div>
                        <div class="chat-sidebar__body">
                            <button type="button" class="chat-sidebar__new" id="newChatBtn">
                                <span class="chat-sidebar__new-icon" aria-hidden="true">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                        <path
                                            d="M8 3.5v9M3.5 8h9"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                            stroke-linecap="round"
                                        />
                                    </svg>
                                </span>
                                New chat
                            </button>
                            <ul class="chat-sidebar__list" id="chatSessionList"></ul>
                        </div>
                    </aside>
                    <div class="chat-main">
                        <div class="chat-log" id="chatLog"></div>
                        <div class="chat-composer-wrap">
                            <div class="chat-composer__pending" id="chatComposerPending" hidden>
                                <ul
                                    class="chat-composer__pending-list"
                                    id="chatComposerPendingList"
                                    aria-label="PDFs attached to your next message"
                                ></ul>
                            </div>
                            <form class="chat-composer" id="chatForm">
                            <input
                                type="file"
                                id="chatFileInput"
                                accept="application/pdf,.pdf"
                                hidden
                            />
                            <div class="chat-composer__bubble">
                                <label class="sr-only" for="chatInput">Message</label>
                                <textarea
                                    id="chatInput"
                                    name="message"
                                    rows="1"
                                    autocomplete="off"
                                    placeholder="Type your message…"
                                ></textarea>
                                <div class="chat-composer__actions">
                                    <button
                                        type="button"
                                        class="chat-composer__attach"
                                        id="attachFileBtn"
                                        aria-label="Attach PDF"
                                    >
                                        <span class="chat-composer__attach-icon" aria-hidden="true">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                                <path
                                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                                                    stroke="currentColor"
                                                    stroke-width="1.75"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                />
                                            </svg>
                                        </span>
                                        <span class="chat-composer__attach-spinner" aria-hidden="true"></span>
                                    </button>
                                    <button
                                        type="submit"
                                        class="chat-composer__send"
                                        id="sendBtn"
                                        aria-label="Send message"
                                        disabled
                                    >
                                        <span class="chat-composer__send-icon" aria-hidden="true">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                                <path
                                                    d="M12 19V5"
                                                    stroke="currentColor"
                                                    stroke-width="3"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                />
                                                <path
                                                    d="M5 12l7-7 7 7"
                                                    stroke="currentColor"
                                                    stroke-width="3"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                />
                                            </svg>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </form>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel panel-notes" aria-label="Assignment editor">
                <div class="panel-notes__header">
                    <h2 class="panel-notes__label">Assignment Editor</h2>
                    <button
                        type="button"
                        id="submitAssignmentBtn"
                        class="note-submit-btn"
                        aria-label="Submit assignment to Google Drive"
                        title="Submit assignment"
                    >
                        Submit
                    </button>
                </div>
                <div id="noteToolbar" class="note-format-toolbar" aria-label="Text formatting">
                    <div class="note-format-toolbar__group">
                        <button type="button" data-command="bold" aria-label="Bold">B</button>
                        <button type="button" data-command="italic" aria-label="Italic">I</button>
                        <button type="button" data-command="underline" aria-label="Underline">U</button>
                    </div>
                    <div class="note-format-toolbar__group">
                        <button type="button" data-command="insertUnorderedList" aria-label="Bullet list">•</button>
                        <button type="button" data-command="insertOrderedList" aria-label="Numbered list">1.</button>
                        <button type="button" data-insert="§" aria-label="Insert section symbol" title="Section (§)">§</button>
                    </div>
                    <div class="note-format-toolbar__group note-format-toolbar__group--end">
                        <button
                            type="button"
                            id="exportPdfBtn"
                            class="note-export-pdf-btn"
                            aria-label="Download assignment as PDF"
                            title="Download PDF"
                        >
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path
                                    d="M12 3v10m0 0l4-4m-4 4L8 9M5 17h14"
                                    stroke="currentColor"
                                    stroke-width="1.75"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="pleadingPaper" class="pleading-paper">
                    <div class="pleading-viewport">
                        <div id="pleadingScaleSizer" class="pleading-scale-sizer">
                            <div id="pleadingScaleFrame" class="pleading-scale-frame">
                                <div id="pleadingScrollSurface" class="pleading-scroll-surface">
                                    <div id="pleadingBackdrop" class="pleading-backdrop" aria-hidden="true"></div>
                                    <div class="pleading-editor-layer">
                                        <div class="notes-editor-wrap">
                                            <div
                                                id="noteEditor"
                                                class="pleading-editor"
                                                contenteditable="true"
                                                role="textbox"
                                                aria-multiline="true"
                                                aria-label="Notes"
                                                data-placeholder="Write your assignment here"
                                                spellcheck="true"
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <p
            id="noteBusyStatus"
            class="note-busy-cursor-note"
            hidden
            role="status"
            aria-live="polite"
        >
            <span class="note-busy-cursor-note__spinner" aria-hidden="true"></span>
            <span id="noteBusyStatusText" class="note-busy-cursor-note__text"></span>
        </p>
        <script src="./vendor/html2canvas.min.js"></script>
        <script src="./vendor/jspdf.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script src="./js/pleading/layout-spec.js?v=20260711b"></script>
        <script src="./js/pleading/page-view.js?v=20260711b"></script>
        <script src="./js/pleading/paginator.js?v=20260711b"></script>
        <script src="./js/pleading/stylesheet.js?v=20260711b"></script>
        <script src="./js/pleading-editor/layout.js?v=20260711b"></script>
        <script src="./js/pleading/document.js?v=20260711b"></script>
        <script src="./js/pleading/export-pdf.js?v=20260711k"></script>
        <script src="./js/pleading-editor/editor.js?v=20260711b"></script>
        <script src="./js/config.js?v=20260711al"></script>
        <script src="./js/logging.js?v=20260712a"></script>
        <script src="./js/chat.js?v=20260712c"></script>
        <script src="./js/notes.js?v=20260712b"></script>
    </body>
</html>
